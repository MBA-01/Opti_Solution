site:
  name: OptiSolution
  # astro.config.ts replaces this with PUBLIC_SITE_URL. Review builds use a
  # non-public placeholder and remain noindex until release is explicit.
  site: 'https://review.invalid'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: null

# Default SEO metadata
metadata:
  title:
    default: OptiSolution
    template: '%s — OptiSolution'
  description: 'Découvrez une solution Odoo pour suivre clients, corrections optiques, devis, achats fournisseurs, stock et facturation. Demandez une démonstration adaptée à votre magasin.'
  robots:
    index: false
    follow: false
  openGraph:
    site_name: OptiSolution
    images: []
    type: website
  twitter:
    cardType: summary

i18n:
  language: fr
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 8

    post:
      isEnabled: false
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: false
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: false
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: false
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'light:only' # Public identity and final media remain under review.
